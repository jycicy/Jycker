<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨年倒计时</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #000;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073, 0 0 40px #e60073;
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    .countdown {
      display: flex;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .time-unit {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 1.5rem 1rem;
      min-width: 120px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .time-value {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 10px #00ffff;
    }

    .time-label {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .new-year-message {
      font-size: 2rem;
      opacity: 0;
      transition: opacity 2s;
      text-shadow: 0 0 10px #ff00ff;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #e60073, 0 0 20px #e60073;
      }

      to {
        text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6;
      }
    }

    @media (max-width: 768px) {
      .countdown {
        flex-wrap: wrap;
        gap: 1rem;
      }

      .time-unit {
        min-width: 80px;
        padding: 1rem 0.5rem;
      }

      .time-value {
        font-size: 2rem;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <canvas id="fireworks"></canvas>

  <div class="container">
    <h1>新年倒计时</h1>

    <div class="countdown">
      <div class="time-unit">
        <div class="time-value" id="days">00</div>
        <div class="time-label">天</div>
      </div>
      <div class="time-unit">
        <div class="time-value" id="hours">00</div>
        <div class="time-label">时</div>
      </div>
      <div class="time-unit">
        <div class="time-value" id="minutes">00</div>
        <div class="time-label">分</div>
      </div>
      <div class="time-unit">
        <div class="time-value" id="seconds">00</div>
        <div class="time-label">秒</div>
      </div>
    </div>

    <div class="new-year-message" id="newYearMessage">
      新年快乐！
    </div>
  </div>

  <script>
    // 获取下一个新年日期
    function getNextNewYear() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const nextNewYear = new Date(currentYear + 1, 0, 1, 0, 0, 0);
      return nextNewYear;
    }

    // 更新倒计时
    function updateCountdown() {
      const now = new Date();
      const nextNewYear = getNextNewYear();
      const diff = nextNewYear - now;

      // 计算天、小时、分钟、秒
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      // 更新显示
      document.getElementById('days').textContent = days.toString().padStart(2, '0');
      document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
      document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
      document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');

      // 如果倒计时结束，显示新年祝福
      if (diff <= 0) {
        document.getElementById('newYearMessage').style.opacity = '1';
        createFirework();
      }
    }

    // 烟花粒子类
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 2 + 1;
        this.velocity = {
          x: (Math.random() - 0.5) * 10,
          y: (Math.random() - 0.5) * 10
        };
        this.alpha = 1;
        this.gravity = 0.05;
        this.decay = 0.015;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update(ctx) {
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= this.decay;

        this.draw(ctx);
        return this.alpha > 0;
      }
    }

    // 烟花类
    class Firework {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.particles = [];
        this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
        this.particleCount = 100;

        for (let i = 0; i < this.particleCount; i++) {
          this.particles.push(new Particle(this.x, this.y, this.color));
        }
      }

      update(ctx) {
        let aliveParticles = 0;

        for (let i = 0; i < this.particles.length; i++) {
          if (this.particles[i].update(ctx)) {
            aliveParticles++;
          }
        }

        return aliveParticles > 0;
      }
    }

    // 烟花管理器
    const fireworks = [];
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');

    // 调整画布大小
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 创建烟花
    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height / 2;
      fireworks.push(new Firework(x, y));
    }

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);

      // 创建半透明覆盖层产生拖尾效果
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 更新和绘制烟花
      for (let i = fireworks.length - 1; i >= 0; i--) {
        if (!fireworks[i].update(ctx)) {
          fireworks.splice(i, 1);
        }
      }

      // 随机创建烟花
      if (Math.random() < 0.03) {
        createFirework();
      }
    }

    // 启动动画
    animate();

    // 初始化倒计时
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>

</html>
